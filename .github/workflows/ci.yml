name: guillotina_oauth_server

on: [push, pull_request]

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure CHANGELOG.rst is updated
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip changelog') }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qx 'CHANGELOG.rst'; then
            echo "CHANGELOG.rst was updated."
          else
            echo "::error::This PR does not update CHANGELOG.rst. Add an entry under the '(unreleased)' section, or apply the 'skip changelog' label for changes that need no release note."
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --verbose --redact

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        database: ["DUMMY", "postgresql"]
    env:
      DATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linters and formatting
      - name: Pre-checks
        run: |
          pip install flake8 isort black==24.10.0
          flake8 guillotina_oauth_server --config=setup.cfg
          isort -c guillotina_oauth_server
          black --check --verbose guillotina_oauth_server

      # Run tests
      - name: Run tests
        run: |
          pip install -e ".[test,mcp,redis]"
          pytest --capture=no --tb=native -v guillotina_oauth_server --cov=guillotina_oauth_server --cov-report term-missing --cov-append guillotina_oauth_server
