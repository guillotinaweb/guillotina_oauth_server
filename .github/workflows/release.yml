name: Publish to PyPI

# Publishes the package to PyPI whenever a GitHub Release is published.
# Authentication uses PyPI Trusted Publishing (OIDC) — no API token is stored
# anywhere. See README.rst ("Releasing") for the one-time PyPI setup.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(cat VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION file: $PKG_VERSION  |  git tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::VERSION ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/guillotina_oauth_server/
    permissions:
      id-token: write  # required for OIDC / Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
