[aliases]
test = pytest

[zest.releaser]
create-wheel = yes
# Tag releases as vX.Y.Z for consistency with v1.0.0 / v1.0.1 (default would be
# the bare version, e.g. 1.0.2).
tag-format = v{version}
# Publishing to PyPI is handled by GitHub Actions (release.yml) via Trusted
# Publishing; do not let zest.releaser upload from a local machine.
release = no

[isort]
profile=black
lines_after_imports=2
line_length=110
skip_glob=*.pyi

[tool:pytest]
asyncio_mode = auto
filterwarnings =
    ignore::ResourceWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    app_settings: customize app_settings for tests

[flake8]
max_line_length = 120
no-accept-encodings = True
ignore =
  E302
  W391
  E701
  W504
  F901
  E252
  W503
  E203
  BLK100
  F541
