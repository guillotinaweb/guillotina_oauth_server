[aliases]
test = pytest

[zest.releaser]
create-wheel = yes

[isort]
profile=black
lines_after_imports=2
line_length=110
skip_glob=*.pyi

[tool:pytest]
asyncio_mode = auto
filterwarnings =
    ignore::ResourceWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    app_settings: customize app_settings for tests

[flake8]
max_line_length = 120
no-accept-encodings = True
ignore =
  E302
  W391
  E701
  W504
  F901
  E252
  W503
  E203
  BLK100
  F541
